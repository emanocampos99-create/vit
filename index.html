<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinder - Vitoria Carvalho</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Top Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 20;
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            font-size: 14px;
            font-weight: 600;
        }

        .top-bar span {
            opacity: 0.7;
        }

        .top-bar span.active {
            opacity: 1;
            border-bottom: 2px solid #fe3c72;
            padding-bottom: 2px;
        }

        /* Indicators */
        .indicators {
            position: absolute;
            top: 55px;
            left: 0;
            width: 100%;
            display: flex;
            gap: 4px;
            padding: 0 10px;
            z-index: 20;
        }

        .indicator {
            flex: 1;
            height: 3px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 2px;
        }

        .indicator.active {
            background-color: white;
        }

        /* Card Container - Área de clique */
        .card-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 5;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        .card-image.active {
            display: block;
        }

        /* Overlay Gradiente */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 20%, rgba(0,0,0,0.6) 60%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }

        /* Profile Info */
        .profile-info {
            position: absolute;
            bottom: 85px;
            left: 20px;
            right: 20px;
            z-index: 15;
            pointer-events: none;
        }

        .profile-name {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verified {
            color: #2db6fa;
            font-size: 20px;
        }

        /* BANNER GIGANTE CENTRALIZADO */
        .giant-banner {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #fe3c72, #ff416c);
            color: white;
            font-size: 34px;
            font-weight: 900;
            padding: 18px 28px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(254, 60, 114, 0.9);
            text-align: center;
            z-index: 25;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 3.5px solid #fff;
            animation: bounceIn 0.8s ease, pulseGlow 2s infinite;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 15px 40px rgba(254, 60, 114, 0.8); }
            50% { box-shadow: 0 20px 60px rgba(254, 60, 114, 1); transform: translate(-50%, -50%) scale(1.03); }
            100% { box-shadow: 0 15px 40px rgba(254, 60, 114, 0.8); }
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        /* Actions */
        .actions {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 20;
        }

        .btn {
            background: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 50px;
            height: 50px;
            font-size: 20px;
        }

        .btn-dislike { color: #fd5068; width: 55px; height: 55px; font-size: 24px; }
        .btn-like { color: #1eee9f; width: 55px; height: 55px; font-size: 24px; }

        /* Footer Nav */
        .footer-nav {
            background: #000;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 5px 0;
            border-top: 1px solid #222;
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #777;
            gap: 3px;
        }

        .nav-item.active {
            color: #fe3c72;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>

    <script>
        const imagens = document.querySelectorAll('.card-image');
        const indicadores = document.querySelectorAll('.indicator');
        const tagsContainer = document.getElementById('tags-container');
        
        const tagsLista = [
            '<div class="tag">🍷 Em ocasiões especiais</div><div class="tag">🐶 Cachorro</div><div class="tag">🚭 Não fumo</div><div class="tag">♏ Escorpião</div>',
            '<div class="tag">📍 a 27 milhas de distância</div>',
            '<div class="tag">👋 Novas amizades</div>'
        ];

        let indiceAtual = 0;

        function atualizarInterface() {
            imagens.forEach((img, i) => {
                if (i === indiceAtual) {
                    img.classList.add('active');
                } else {
                    img.classList.remove('active');
                }
            });

            indicadores.forEach((ind, i) => {
                if (i === indiceAtual) {
                    ind.classList.add('active');
                } else {
                    ind.classList.remove('active');
                }
            });

            tagsContainer.innerHTML = tagsLista[indiceAtual];
        }

        function mudarFoto(direcao) {
            indiceAtual = (indiceAtual + direcao + imagens.length) % imagens.length;
            atualizarInterface();
        }

        document.getElementById('cardArea').addEventListener('click', function(e) {
            const larguraTela = this.clientWidth;
            const cliqueX = e.offsetX;
            
            if (cliqueX < larguraTela / 2) {
                mudarFoto(-1);
            } else {
                mudarFoto(1);
            }
        });
    </script>
